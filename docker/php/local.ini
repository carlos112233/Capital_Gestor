; Configuración PHP personalizada para Capital Gestor
; Este archivo se monta dentro del contenedor PHP-FPM

; ── Subida de archivos (comprobantes, imágenes) ──
upload_max_filesize = 50M
post_max_size = 55M
max_file_uploads = 20

; ── Tiempo de ejecución (generación de PDFs puede tardar) ──
max_execution_time = 120
max_input_time = 120

; ── Memoria (Dompdf y QrCode requieren bastante) ──
memory_limit = 256M

; ── Zona horaria ──
date.timezone = America/Mexico_City

; ── Opcache (acelera PHP en producción) ──
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.fast_shutdown = 1

