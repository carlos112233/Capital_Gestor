server {
    listen 80;
    server_name localhost;

    # Apuntar al directorio público de Laravel
    root /var/www/html/public;
    index index.php index.html;

    # Charset y tamaño máximo de cuerpo (para subir comprobantes/imágenes)
    charset utf-8;
    client_max_body_size 50M;

    # Cabeceras de seguridad (igual que las del servidor de producción en DigitalOcean)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Manejo de rutas de Laravel (Single Page)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Proxy inverso para WebSockets de Laravel Reverb
    location /app/ {
        proxy_pass http://php:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /apps/ {
        proxy_pass http://php:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Procesamiento de archivos PHP a través de PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Conectar con el contenedor PHP-FPM por red interna (no por socket Unix)
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_read_timeout 120;
    }

    # Archivos estáticos: acceso directo sin pasar por PHP
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    # Bloquear acceso a archivos ocultos (ej. .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Suprimir logs de peticiones triviales
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Página de error personalizada de Laravel
    error_page 404 /index.php;

    # Logs
    access_log /var/log/nginx/capital_gestor_access.log;
    error_log  /var/log/nginx/capital_gestor_error.log;
}

